name: CI

on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  test-ubuntu:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run all tests
        run: npm test
        env:
          DB_URL: mongodb://localhost:27017/testdb

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run all tests
        run: npm test

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t template-server:test .

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for app to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:443/api/ping > /dev/null 2>&1; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start"
          docker compose logs app
          exit 1

      - name: Test /api/ping
        run: |
          response=$(curl -sf http://localhost:443/api/ping)
          echo "$response"
          echo "$response" | grep -q '"ok":true'

      - name: Test /api/health
        run: |
          response=$(curl -sf http://localhost:443/api/health)
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'
          echo "$response" | grep -q '"db":"on"'

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v
