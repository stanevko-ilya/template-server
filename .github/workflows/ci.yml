name: CI

on:
  push:
    branches: [main, development, typescript-version]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

  build:
    name: Build (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

  test-ubuntu:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - name: Run all tests
        run: yarn test
        env:
          DB_URL: mongodb://localhost:27017/testdb-test

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install and start MongoDB
        uses: ankane/setup-mongodb@v1
        with:
          mongodb-version: '7.0'

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - name: Run all tests
        run: yarn test
        env:
          DB_URL: mongodb://localhost:27017/testdb-test

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.docker.example .env.docker

      - name: Build Docker image
        run: docker build -f packages/backend/Dockerfile -t template-server:test .

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for stack to start (nginx :80 -> backend)..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost/api/ping > /dev/null 2>&1; then
              echo "Stack is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Stack failed to start"
          docker compose ps
          docker compose logs backend nginx
          exit 1

      - name: Test /api/ping
        run: |
          response=$(curl -sf http://localhost/api/ping)
          echo "$response"
          echo "$response" | grep -q '"ok":true'

      - name: Test /api/health
        run: |
          response=$(curl -sf http://localhost/api/health)
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'
          echo "$response" | grep -q '"db":"on"'

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v
