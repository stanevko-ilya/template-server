# Базовый reverse-proxy (HTTP) для docker-compose.yml.
# Балансирует запросы round-robin по всем репликам сервиса backend.

# Docker embedded DNS — резолвит реплики backend на лету (valid=5s — частота ре-резолва)
resolver 127.0.0.11 valid=5s ipv6=off;

# В access-логе видно, на какую реплику ушёл запрос ($upstream_addr)
log_format upstream '$remote_addr -> $upstream_addr  "$request"  $status  ${request_time}s';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log upstream;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # API — round-robin по всем репликам backend (порт 3000).
    # Переменная в proxy_pass заставляет nginx ре-резолвить `backend` на каждый запрос.
    location /api/ {
        set $api_upstream backend;
        proxy_set_header Connection "";
        proxy_pass http://$api_upstream:3000;
    }

    # Socket.IO — порт 3001. Для мультиреплики используйте на клиенте
    # transports:['websocket'] (Redis-adapter доставляет события между репликами),
    # либо включите sticky-сессии. WebSocket-апгрейд:
    location /socket.io/ {
        set $ws_upstream backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://$ws_upstream:3001;
    }
}
