# Базовый стек (HTTP). Запуск: docker compose up -d --build
# nginx (LB) → backend (реплики) + notifier + mongo (replica set) + redis.
# Для TLS/Let's Encrypt используйте оверлей: -f docker-compose.yml -f docker-compose.prod.yml

services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    command: ["node", "dist/index.js"]
    env_file: [.env.docker]
    environment:
      - API_PORT=3000
      - SOCKETS_PORT=3001
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "1", memory: 512M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [app-network]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  notifier:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    command: ["node", "dist/notifier.js"]
    env_file: [.env.docker]
    environment:
      - HEALTH_PORT=3001
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [app-network]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Single-node replica set (нужен для транзакций/change streams). Без auth — для
  # продакшена включите --auth + --keyFile (см. docker/README.md).
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [app-network]
    restart: unless-stopped

  mongo-init:
    image: mongo:7
    depends_on:
      mongo: { condition: service_healthy }
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        mongosh --host mongo --quiet --eval "try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"
    networks: [app-network]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-network]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: { condition: service_healthy }
    networks: [app-network]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
